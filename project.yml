name: MusicPlayer
options:
  bundleIdPrefix: com.musicplayer
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_STRICT_CONCURRENCY: minimal
  CODE_SIGN_STYLE: Automatic
targets:
  MusicPlayer:
    type: application
    platform: iOS
    sources:
      - path: MusicPlayer
        excludes:
          - macOS/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mujassir.musicplayer
        PRODUCT_NAME: MusicPlayer
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Music Player
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/iOS-Info.plist
      properties:
        UIBackgroundModes:
          - audio
    entitlements:
      path: Config/iOS.entitlements
      properties: {}
    scheme:
      gatherCoverageData: false
  MusicPlayerMac:
    type: application
    platform: macOS
    sources:
      - path: MusicPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mujassir.musicplayer
        PRODUCT_NAME: MusicPlayer
        INFOPLIST_KEY_CFBundleDisplayName: Music Player
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Config/macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
    scheme:
      gatherCoverageData: false
schemes:
  MusicPlayer:
    build:
      targets:
        MusicPlayer: all
    run:
      config: Debug
  MusicPlayerMac:
    build:
      targets:
        MusicPlayerMac: all
    run:
      config: Debug
